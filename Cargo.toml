[package]
name = "spqr-shortest-path-index"
description = "A shortest-path index for bidirected graphs based on the SPQR decomposition."
version = "0.1.0"
authors = ["Sebastian Schmidt <sebastian.schmidt@helsinki.fi>"]
license = "BSD-2-Clause"
repository = "https://github.com/sebschmi/spqr-shortest-path-index"

edition = "2024"

[features]
serde = ["dep:serde"]

[dependencies]
spqr-tree = { version = "0.2.4", features = ["bidirected-adjacency-array"] }
bidirected-adjacency-array = { version = "0.2.5" }
optional-numeric-index = "0.4.0"
num-traits = "0.2.19"
binary-heap-plus = "0.5.0"
tagged-vec = "0.4.4"
bitvec = "1.0.1"
epoch-reset-array = "0.1.0"
serde = { version = "1.0.228", features = ["derive"], optional = true }
